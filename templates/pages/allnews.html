{% extends "layouts/gridlay.html" %}

{% block page_content %}
<header class="page-head">
  <p class="eyebrow">Updates</p>
  <h1>News</h1>
</header>

<ol class="news-timeline" reversed>
{% for article in site.data.news %}
  <li class="news-item">
    <span class="news-date">{{ article.date }}</span>
    <div class="news-headline">{{ article.headline | safe }}</div>
  </li>
{% endfor %}
</ol>
{% endblock %}
